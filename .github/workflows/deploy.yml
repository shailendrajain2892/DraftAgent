name: Deploy

# Continuous deployment: every push to main builds the UI + backend image and ships
# it to Fly.io. Requires the repo secret FLY_API_TOKEN (a Fly deploy token).
on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual redeploys from the Actions tab

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main   # never run two deploys at once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only   # fly.toml + Dockerfile now live at the repo root
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
