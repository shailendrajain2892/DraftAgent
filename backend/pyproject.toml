[project]
name = "draftagent-backend"
version = "0.1.0"
description = "DraftAgent backend: FastAPI (OAuth, Gmail tools, style seed, runs) + LangGraph agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "starlette>=0.38",
    "itsdangerous>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "google-api-python-client>=2.130",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    # LangGraph agent (Spec 03). Pinned by the agent owner.
    "langgraph==1.2.12",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core==1.6.4",
    "langchain-openai==1.6.3",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
# Agent deps are now core (see dependencies above). Kept as an empty alias so
# existing `pip install -e ".[agent]"` invocations (Dockerfile) keep working.
agent = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
